name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun run ci

  check-trailing-whitespace:
    runs-on: ubuntu-latest
    name: Check trailing whitespace
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - name: Install dependencies
        run: bun install
      - name: Check trailing whitespace
        run: git ls-files | bun script/check_trailing_whitespace.ts

  generate-typedoc:
    runs-on: ubuntu-latest
    name: Generate typedoc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Generate typedoc
        run: bun run typedoc
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: tmp/docs

  verify-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x ]
    name: Verify NodeJS installation
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable Corepack
        run: corepack enable
      - name: Verify install
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false npm install "https://github.com/martijnversluis/ChordSheetJS/tree/$GITHUB_SHA"
